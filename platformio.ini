; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
;build_cache_dir = .pio/buildcache

; Gemeinsame Einstellungen fuer alle Environments
[env]
platform = espressif32
board = esp32dev
framework = arduino

lib_deps =
	FastLED
	adafruit/DHT sensor library
	milesburton/DallasTemperature

[env:solar_links_Serial]
build_flags = -DSOLAR_LINKS
upload_port = COM18

[env:solar_links_OTA]
build_flags = -DSOLAR_LINKS
upload_protocol = espota
upload_port = 172.24.115.135
upload_flags =
    --timeout=60

[env:solar_links_OTA_BERYL]
build_flags = -DSOLAR_LINKS
upload_protocol = custom
upload_command = python tools/espota_router.py --router root@172.24.115.140 --target 172.24.115.135 --local-ip 172.24.115.140 --timeout 120 --file $SOURCE


[env:solar_rechts_Serial]
build_flags = -DSOLAR_RECHTS
upload_port = COM19
[env:solar_rechts_OTA]
build_flags = -DSOLAR_RECHTS
upload_protocol = espota
upload_port = 172.24.115.189
upload_flags =
    --timeout=60

[env:solar_rechts_OTA_BERYL]
build_flags = -DSOLAR_RECHTS
upload_protocol = custom
upload_command = python tools/espota_router.py --router root@172.24.115.140 --target 172.24.115.189 --local-ip 172.24.115.140 --timeout 120 --file $SOURCE